<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导览器管理系统</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        available: '#10b981',
                        borrowed: '#f59e0b',
                        error: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .nav-item {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }
        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
        }
        .nav-item.active i {
            color: #34d399;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边导航栏 -->
        <aside class="w-64 bg-primary text-white hidden md:block flex flex-col">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold">导览器管理系统</h1>
                <p class="text-sm text-gray-300 mt-1">高效管理您的导览设备</p>
            </div>
            <nav class="mt-4 px-2 space-y-1 flex-1">
                <a href="#dashboard" class="nav-item active flex items-center px-4 py-3 rounded-lg transition-all duration-200" data-page="dashboard">
                    <i class="fa fa-dashboard w-6 text-center mr-3"></i>
                    <span class="font-medium">仪表盘</span>
                </a>
                <a href="#devices" class="nav-item flex items-center px-4 py-3 rounded-lg transition-all duration-200" data-page="devices">
                    <i class="fa fa-headphones w-6 text-center mr-3"></i>
                    <span class="font-medium">设备管理</span>
                </a>
                <a href="#borrow" class="nav-item flex items-center px-4 py-3 rounded-lg transition-all duration-200" data-page="borrow">
                    <i class="fa fa-exchange w-6 text-center mr-3"></i>
                    <span class="font-medium">借用归还</span>
                </a>
                <a href="#reports" class="nav-item flex items-center px-4 py-3 rounded-lg transition-all duration-200" data-page="reports">
                    <i class="fa fa-bar-chart w-6 text-center mr-3"></i>
                    <span class="font-medium">统计报表</span>
                </a>
                <a href="#guides" class="nav-item flex items-center px-4 py-3 rounded-lg transition-all duration-200" data-page="guides">
                    <i class="fa fa-users w-6 text-center mr-3"></i>
                    <span class="font-medium">导游管理</span>
                </a>
            </nav>
            <div class="p-4 border-t border-blue-700">
                <div class="text-sm text-gray-300">
                    <div class="flex items-center mb-1">
                        <i class="fa fa-info-circle w-5 text-center mr-2"></i>
                        <span>设备总数: <span class="font-semibold text-white" id="sidebar-total-devices">15</span></span>
                    </div>
                    <div class="flex items-center">
                        <i class="fa fa-check-circle w-5 text-center mr-2"></i>
                        <span>可用设备: <span class="font-semibold text-green-300" id="sidebar-available-devices">10</span></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 移动端导航菜单按钮 -->
        <div class="md:hidden fixed bottom-4 right-4 z-50">
            <button id="mobile-menu-btn" class="bg-primary text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center">
                <i class="fa fa-bars"></i>
            </button>
        </div>

        <!-- 移动端导航菜单 -->
        <div id="mobile-menu" class="fixed inset-0 bg-primary z-40 transform translate-x-full transition-transform duration-300 md:hidden">
            <div class="p-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white">导览器管理系统</h1>
                <button id="close-mobile-menu" class="text-white text-2xl">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <nav class="mt-6 px-4 space-y-2">
                <a href="#dashboard" class="nav-item active text-white" data-page="dashboard">
                    <i class="fa fa-dashboard w-5 text-center mr-3"></i>
                    <span>仪表盘</span>
                </a>
                <a href="#devices" class="nav-item text-white" data-page="devices">
                    <i class="fa fa-headphones w-5 text-center mr-3"></i>
                    <span>设备管理</span>
                </a>
                <a href="#borrow" class="nav-item text-white" data-page="borrow">
                    <i class="fa fa-exchange w-5 text-center mr-3"></i>
                    <span>借用归还</span>
                </a>
                <a href="#reports" class="nav-item text-white" data-page="reports">
                    <i class="fa fa-bar-chart w-5 text-center mr-3"></i>
                    <span>统计报表</span>
                </a>
                <a href="#guides" class="nav-item text-white" data-page="guides">
                    <i class="fa fa-users w-5 text-center mr-3"></i>
                    <span>导游管理</span>
                </a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-y-auto bg-gray-100">
            <!-- 顶部导航栏 -->
            <header class="bg-white shadow-sm">
                <div class="px-6 py-4 flex justify-between items-center">
                    <div>
                        <h2 id="page-title" class="text-2xl font-bold text-gray-900">仪表盘</h2>
                        <p id="page-subtitle" class="text-sm text-gray-500">欢迎回来，今天是 <span id="current-date"></span></p>
                    </div>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="p-6">
                <!-- 仪表盘页面 -->
                <div id="dashboard-page" class="page active">
                    <!-- 统计卡片 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white rounded-xl shadow p-6 cursor-pointer hover:shadow-lg transition-all duration-300 hover:-translate-y-1" onclick="showStatDetails('total')">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500">总设备数</p>
                                    <p class="text-3xl font-bold" id="total-devices">15</p>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                    <i class="fa fa-headphones"></i>
                                </div>
                            </div>
                            <div class="mt-2 text-xs text-gray-400 flex items-center">
                                <i class="fa fa-info-circle mr-1"></i>
                                <span>点击查看详情</span>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow p-6 cursor-pointer hover:shadow-lg transition-all duration-300 hover:-translate-y-1" onclick="showStatDetails('available')">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500">可用设备</p>
                                    <p class="text-3xl font-bold text-available" id="available-devices">10</p>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-available/10 flex items-center justify-center text-available">
                                    <i class="fa fa-check-circle"></i>
                                </div>
                            </div>
                            <div class="mt-2 text-xs text-gray-400 flex items-center">
                                <i class="fa fa-info-circle mr-1"></i>
                                <span>点击查看详情</span>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow p-6 cursor-pointer hover:shadow-lg transition-all duration-300 hover:-translate-y-1" onclick="showStatDetails('borrowed')">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500">已借出</p>
                                    <p class="text-3xl font-bold text-borrowed" id="borrowed-devices">4</p>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-borrowed/10 flex items-center justify-center text-borrowed">
                                    <i class="fa fa-exchange"></i>
                                </div>
                            </div>
                            <div class="mt-2 text-xs text-gray-400 flex items-center">
                                <i class="fa fa-info-circle mr-1"></i>
                                <span>点击查看详情</span>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow p-6 cursor-pointer hover:shadow-lg transition-all duration-300 hover:-translate-y-1" onclick="showStatDetails('error')">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500">异常设备</p>
                                    <p class="text-3xl font-bold text-error" id="error-devices">1</p>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-error/10 flex items-center justify-center text-error">
                                    <i class="fa fa-exclamation-triangle"></i>
                                </div>
                            </div>
                            <div class="mt-2 text-xs text-gray-400 flex items-center">
                                <i class="fa fa-info-circle mr-1"></i>
                                <span>点击查看详情</span>
                            </div>
                        </div>
                    </div>

                    <!-- 设备状态卡片 -->
                    <div class="bg-white rounded-xl shadow p-6 mb-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-900">设备状态</h3>
                            <div class="flex gap-2">
                                <button id="dashboard-filter-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm flex items-center gap-2 hover:bg-gray-50">
                                    <i class="fa fa-filter"></i>
                                    <span>筛选</span>
                                </button>
                                <button id="dashboard-refresh-btn" class="px-4 py-2 bg-primary text-white rounded-lg text-sm flex items-center gap-2 hover:bg-primary/90">
                                    <i class="fa fa-refresh"></i>
                                    <span>刷新</span>
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" id="device-cards-container">
                            <!-- 设备卡片将通过 JavaScript 动态生成 -->
                        </div>
                    </div>

                    <!-- 最近活动 -->
                    <div class="bg-white rounded-xl shadow p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-6">最近活动</h3>
                        <div class="space-y-4" id="recent-activities">
                            <!-- 最近活动将通过 JavaScript 动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 设备管理页面 -->
                <div id="devices-page" class="page hidden">
                    <div class="bg-white rounded-xl shadow p-6 mb-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-900">设备管理</h3>
                            <div class="flex gap-2">
                                <div class="relative">
                                    <input type="text" id="device-search" placeholder="搜索设备..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
                                </div>
                                <button id="device-filter-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm flex items-center gap-2 hover:bg-gray-50">
                                    <i class="fa fa-filter"></i>
                                    <span>筛选</span>
                                </button>
                                <button id="add-device-btn" class="px-4 py-2 bg-primary text-white rounded-lg text-sm flex items-center gap-2 hover:bg-primary/90">
                                    <i class="fa fa-plus"></i>
                                    <span>添加</span>
                                </button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备编号</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">位置</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">使用人</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">借出时间</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" id="devices-table-body">
                                    <!-- 设备列表将通过 JavaScript 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 借用归还页面 -->
                <div id="borrow-page" class="page hidden">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- 借用设备 -->
                        <div class="bg-white rounded-xl shadow p-6">
                            <h3 class="text-lg font-bold text-gray-900 mb-6">借用设备</h3>
                            <form id="borrow-form">
                                <div class="mb-4">
                                    <label for="guide-select" class="block text-sm font-medium text-gray-700 mb-1">选择导游</label>
                                    <select id="guide-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                                        <option value="">请选择导游</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label for="device-select" class="block text-sm font-medium text-gray-700 mb-1">选择设备</label>
                                    <select id="device-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                                        <option value="">请选择设备</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label for="borrow-notes" class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                                    <textarea id="borrow-notes" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" rows="3" placeholder="请输入备注信息（可选）"></textarea>
                                </div>
                                <div class="flex justify-end">
                                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg flex items-center gap-2 hover:bg-primary/90">
                                        <i class="fa fa-check"></i>
                                        <span>确认借用</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- 归还设备 -->
                        <div class="bg-white rounded-xl shadow p-6">
                            <h3 class="text-lg font-bold text-gray-900 mb-6">归还设备</h3>
                            <form id="return-form">
                                <div class="mb-4">
                                    <label for="return-device-select" class="block text-sm font-medium text-gray-700 mb-1">选择设备</label>
                                    <select id="return-device-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                                        <option value="">请选择设备</option>
                                    </select>
                                </div>
                                <div class="mb-4">
                                    <label for="return-location" class="block text-sm font-medium text-gray-700 mb-1">归还位置</label>
                                    <input type="text" id="return-location" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" value="办公室" required>
                                </div>
                                <div class="mb-4">
                                    <label for="return-notes" class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                                    <textarea id="return-notes" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" rows="3" placeholder="请输入备注信息（可选）"></textarea>
                                </div>
                                <div class="flex justify-end">
                                    <button type="submit" class="px-4 py-2 bg-available text-white rounded-lg flex items-center gap-2 hover:bg-available/90">
                                        <i class="fa fa-check"></i>
                                        <span>确认归还</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 统计报表页面 -->
                <div id="reports-page" class="page hidden">
                    <div class="bg-white rounded-xl shadow p-6 mb-8">
                        <h3 class="text-lg font-bold text-gray-900 mb-6">设备使用统计</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="h-64">
                                <canvas id="device-status-chart"></canvas>
                            </div>
                            <div class="h-64">
                                <canvas id="guide-usage-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 导游管理页面 -->
                <div id="guides-page" class="page hidden">
                    <div class="bg-white rounded-xl shadow p-6 mb-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-900">导游管理</h3>
                            <div class="flex gap-2">
                                <button id="add-guide-btn" class="px-4 py-2 bg-primary text-white rounded-lg text-sm flex items-center gap-2 hover:bg-primary/90">
                                    <i class="fa fa-plus"></i>
                                    <span>添加导游</span>
                                </button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">联系电话</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" id="guides-table-body">
                                    <!-- 导游列表将通过 JavaScript 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加导游模态框 -->
    <div id="add-guide-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-gray-900">添加导游</h3>
                <button id="close-guide-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="guide-form">
                <div class="mb-4">
                    <label for="guide-name" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="guide-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div class="mb-4">
                    <label for="guide-phone" class="block text-sm font-medium text-gray-700 mb-1">联系电话</label>
                    <input type="tel" id="guide-phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div class="flex justify-end mt-6">
                    <button type="button" id="cancel-guide-btn" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg mr-2 hover:bg-gray-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加设备模态框 -->
    <div id="add-device-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-gray-900">添加设备</h3>
                <button id="close-add-device-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="add-device-form">
                <div class="mb-4">
                    <label for="device-id" class="block text-sm font-medium text-gray-700 mb-1">设备编号</label>
                    <input type="text" id="device-id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                </div>
                <div class="mb-4">
                    <label for="device-status" class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                    <select id="device-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="available">可用</option>
                        <option value="borrowed">已借出</option>
                        <option value="error">异常</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="device-location" class="block text-sm font-medium text-gray-700 mb-1">位置</label>
                    <input type="text" id="device-location" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" value="办公室" required>
                </div>
                <div class="flex justify-end mt-6">
                    <button type="button" id="cancel-add-device-btn" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg mr-2 hover:bg-gray-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 通知提示 -->
    <div id="notification" class="fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-x-full">
        <div class="flex items-center gap-3">
            <i id="notification-icon" class="fa fa-info-circle"></i>
            <span id="notification-message"></span>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="details-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl max-h-[80vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h3 id="modal-title" class="text-xl font-bold text-gray-900">详情</h3>
                    <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="p-6">
                <div id="modal-content">
                    <!-- 弹窗内容将通过 JavaScript 动态生成 -->
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end">
                <button id="modal-close-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let devices = [];
        let guides = [];
        let records = [];

        // 初始化数据
        function initializeData() {
            // 检查本地存储中是否已有数据
            if (!localStorage.getItem('devices')) {
                // 初始化15个设备
                devices = [];
                for (let i = 1; i <= 15; i++) {
                    devices.push({
                        id: i.toString(),
                        status: i <= 10 ? 'available' : (i <= 14 ? 'borrowed' : 'error'),
                        location: i <= 10 ? '办公室' : (i <= 14 ? '导游 ' + (i - 10) : '维修部'),
                        borrower: i <= 10 ? '' : (i <= 14 ? (i - 10).toString() : ''),
                        borrowTime: i <= 10 ? null : new Date(Date.now() - (i - 10) * 3600000).toISOString(),
                        notes: i === 15 ? '无法开机，需要维修' : ''
                    });
                }
                localStorage.setItem('devices', JSON.stringify(devices));
            } else {
                devices = JSON.parse(localStorage.getItem('devices'));
            }

            if (!localStorage.getItem('guides')) {
                // 初始化导游数据
                guides = [
                    { id: '1', name: '张三', phone: '13800138001', active: true },
                    { id: '2', name: '李四', phone: '13900139002', active: true },
                    { id: '3', name: '王五', phone: '13700137003', active: true },
                    { id: '4', name: '赵六', phone: '13600136004', active: true }
                ];
                localStorage.setItem('guides', JSON.stringify(guides));
            } else {
                guides = JSON.parse(localStorage.getItem('guides'));
            }

            if (!localStorage.getItem('records')) {
                // 初始化借用记录
                records = [
                    {
                        id: '1',
                        deviceId: '11',
                        guideId: '1',
                        borrowTime: new Date(Date.now() - 3600000).toISOString(),
                        returnTime: null,
                        status: 'active'
                    },
                    {
                        id: '2',
                        deviceId: '12',
                        guideId: '2',
                        borrowTime: new Date(Date.now() - 7200000).toISOString(),
                        returnTime: null,
                        status: 'active'
                    },
                    {
                        id: '3',
                        deviceId: '13',
                        guideId: '3',
                        borrowTime: new Date(Date.now() - 10800000).toISOString(),
                        returnTime: null,
                        status: 'active'
                    },
                    {
                        id: '4',
                        deviceId: '14',
                        guideId: '4',
                        borrowTime: new Date(Date.now() - 14400000).toISOString(),
                        returnTime: null,
                        status: 'active'
                    }
                ];
                localStorage.setItem('records', JSON.stringify(records));
            } else {
                records = JSON.parse(localStorage.getItem('records'));
            }
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('devices', JSON.stringify(devices));
            localStorage.setItem('guides', JSON.stringify(guides));
            localStorage.setItem('records', JSON.stringify(records));
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notification-icon');
            const messageEl = document.getElementById('notification-message');

            // 设置消息内容
            messageEl.textContent = message;

            // 设置样式
            notification.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300';
            
            if (type === 'error') {
                notification.classList.add('bg-error', 'text-white');
                icon.className = 'fa fa-exclamation-circle';
            } else if (type === 'success') {
                notification.classList.add('bg-available', 'text-white');
                icon.className = 'fa fa-check-circle';
            } else {
                notification.classList.add('bg-primary', 'text-white');
                icon.className = 'fa fa-info-circle';
            }

            // 显示通知
            notification.classList.remove('translate-x-full');

            // 3秒后隐藏
            setTimeout(() => {
                notification.classList.add('translate-x-full');
            }, 3000);
        }

        // 格式化日期时间
        function formatDateTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 计算设备统计
        function calculateDeviceStats() {
            const stats = {
                total: devices.length,
                available: devices.filter(d => d.status === 'available').length,
                borrowed: devices.filter(d => d.status === 'borrowed').length,
                error: devices.filter(d => d.status === 'error').length
            };
            return stats;
        }

        // 更新统计显示
        function updateStatsDisplay() {
            const stats = calculateDeviceStats();
            document.getElementById('total-devices').textContent = stats.total;
            document.getElementById('available-devices').textContent = stats.available;
            document.getElementById('borrowed-devices').textContent = stats.borrowed;
            document.getElementById('error-devices').textContent = stats.error;
            
            // 更新侧边栏统计信息
            if (document.getElementById('sidebar-total-devices')) {
                document.getElementById('sidebar-total-devices').textContent = stats.total;
            }
            if (document.getElementById('sidebar-available-devices')) {
                document.getElementById('sidebar-available-devices').textContent = stats.available;
            }
        }

        // 获取导游姓名
        function getGuideNameById(id) {
            const guide = guides.find(g => g.id === id);
            return guide ? guide.name : '未知';
        }

        // 生成设备卡片
        function generateDeviceCards() {
            const container = document.getElementById('device-cards-container');
            container.innerHTML = '';

            devices.forEach(device => {
                const statusText = device.status === 'available' ? '可用' : (device.status === 'borrowed' ? '已借出' : '异常');
                const statusColor = device.status === 'available' ? 'bg-available' : (device.status === 'borrowed' ? 'bg-borrowed' : 'bg-error');
                
                const card = document.createElement('div');
                card.className = 'relative overflow-hidden rounded-lg shadow p-4 transition-all duration-300 hover:shadow-lg hover:-translate-y-1 cursor-pointer';
                
                card.innerHTML = `
                    <span class="absolute top-2 right-2 text-xs font-bold px-2 py-1 rounded-full ${statusColor} text-white">${statusText}</span>
                    <div class="text-lg font-bold">设备 #${device.id}</div>
                    <div class="text-sm text-gray-500 mt-1">位置: ${device.location}</div>
                    ${device.status === 'borrowed' ? `
                        <div class="text-sm text-gray-500 mt-1">使用人: ${getGuideNameById(device.borrower)}</div>
                        <div class="text-sm text-gray-500 mt-1">借出时间: ${formatDateTime(device.borrowTime)}</div>
                    ` : ''}
                    ${device.notes ? `
                        <div class="text-sm text-error mt-1">${device.notes}</div>
                    ` : ''}
                `;
                
                container.appendChild(card);
            });
        }

        // 生成最近活动
        function generateRecentActivities() {
            const container = document.getElementById('recent-activities');
            container.innerHTML = '';

            // 按时间排序记录
            const sortedRecords = [...records].sort((a, b) => new Date(b.borrowTime) - new Date(a.borrowTime));

            sortedRecords.slice(0, 5).forEach(record => {
                const guide = guides.find(g => g.id === record.guideId);
                const device = devices.find(d => d.id === record.deviceId);

                if (!guide || !device) return;

                const activity = document.createElement('div');
                activity.className = 'flex items-start gap-3';
                
                activity.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                        <i class="fa fa-${record.status === 'active' ? 'sign-out' : 'sign-in'}"></i>
                    </div>
                    <div>
                        <p class="font-medium">${guide.name} ${record.status === 'active' ? '借出了' : '归还了'} 设备 #${device.id}</p>
                        <p class="text-sm text-gray-500">${formatDateTime(record.status === 'active' ? record.borrowTime : record.returnTime)}</p>
                    </div>
                `;
                
                container.appendChild(activity);
            });
        }

        // 生成设备管理表格
        function generateDevicesTable() {
            const tableBody = document.getElementById('devices-table-body');
            tableBody.innerHTML = '';

            devices.forEach(device => {
                const statusText = device.status === 'available' ? '可用' : (device.status === 'borrowed' ? '已借出' : '异常');
                const statusColor = device.status === 'available' ? 'bg-available/20 text-available' : (device.status === 'borrowed' ? 'bg-borrowed/20 text-borrowed' : 'bg-error/20 text-error');

                const row = document.createElement('tr');
                row.className = 'bg-white border-b hover:bg-gray-50';
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${device.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.location}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.status === 'borrowed' ? getGuideNameById(device.borrower) : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.borrowTime ? formatDateTime(device.borrowTime) : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex gap-2">
                            <button class="text-primary hover:text-primary/80 edit-device-btn" data-id="${device.id}">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="text-error hover:text-error/80 delete-device-btn" data-id="${device.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });

            // 添加编辑和删除事件
            document.querySelectorAll('.edit-device-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    showEditDeviceModal(btn.dataset.id);
                });
            });

            document.querySelectorAll('.delete-device-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('确定要删除这个设备吗？')) {
                        deleteDevice(btn.dataset.id);
                    }
                });
            });
        }

        // 生成导游管理表格
        function generateGuidesTable() {
            const tableBody = document.getElementById('guides-table-body');
            tableBody.innerHTML = '';

            guides.forEach(guide => {
                const borrowedCount = devices.filter(d => d.status === 'borrowed' && d.borrower === guide.id).length;
                const statusText = guide.active ? '在职' : '离职';
                const statusColor = guide.active ? 'bg-available/20 text-available' : 'bg-error/20 text-error';

                const row = document.createElement('tr');
                row.className = 'bg-white border-b hover:bg-gray-50';
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${guide.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${guide.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${guide.phone || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex gap-2">
                            <button class="text-primary hover:text-primary/80 edit-guide-btn" data-id="${guide.id}">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="text-error hover:text-error/80 delete-guide-btn" data-id="${guide.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });

            // 添加编辑和删除事件
            document.querySelectorAll('.edit-guide-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    showEditGuideModal(btn.dataset.id);
                });
            });

            document.querySelectorAll('.delete-guide-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('确定要删除这个导游吗？')) {
                        deleteGuide(btn.dataset.id);
                    }
                });
            });
        }

        // 更新借用归还表单
        function updateBorrowForms() {
            const activeGuides = guides.filter(g => g.active);
            const availableDevices = devices.filter(d => d.status === 'available');
            const borrowedDevices = devices.filter(d => d.status === 'borrowed');

            // 更新导游选择
            const guideSelect = document.getElementById('guide-select');
            guideSelect.innerHTML = '<option value="">请选择导游</option>';
            activeGuides.forEach(guide => {
                const option = document.createElement('option');
                option.value = guide.id;
                option.textContent = guide.name;
                guideSelect.appendChild(option);
            });

            // 更新可用设备选择
            const deviceSelect = document.getElementById('device-select');
            deviceSelect.innerHTML = '<option value="">请选择设备</option>';
            availableDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.id;
                option.textContent = `设备 #${device.id} (${device.location})`;
                deviceSelect.appendChild(option);
            });

            // 更新已借出设备选择
            const returnDeviceSelect = document.getElementById('return-device-select');
            returnDeviceSelect.innerHTML = '<option value="">请选择设备</option>';
            borrowedDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.id;
                option.textContent = `设备 #${device.id} (${getGuideNameById(device.borrower)})`;
                returnDeviceSelect.appendChild(option);
            });
        }

        // 初始化图表
        function initializeCharts() {
            // 设备状态饼图
            const deviceStatusCtx = document.getElementById('device-status-chart').getContext('2d');
            const stats = calculateDeviceStats();
            
            new Chart(deviceStatusCtx, {
                type: 'pie',
                data: {
                    labels: ['可用', '已借出', '异常'],
                    datasets: [{
                        data: [stats.available, stats.borrowed, stats.error],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: '设备状态分布'
                        }
                    }
                }
            });

            // 导游使用柱状图
            const guideUsageCtx = document.getElementById('guide-usage-chart').getContext('2d');
            const guideUsage = guides.map(guide => {
                const guideRecords = records.filter(r => r.guideId === guide.id);
                return {
                    name: guide.name,
                    count: guideRecords.length
                };
            });
            
            new Chart(guideUsageCtx, {
                type: 'bar',
                data: {
                    labels: guideUsage.map(g => g.name),
                    datasets: [{
                        label: '借用次数',
                        data: guideUsage.map(g => g.count),
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: '导游借用频次'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }

        // 显示统计详情
        function showStatDetails(statType) {
            const modal = document.getElementById('details-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            let filteredDevices = [];
            let titleText = '';
            
            switch(statType) {
                case 'total':
                    filteredDevices = devices;
                    titleText = '所有设备详情';
                    break;
                case 'available':
                    filteredDevices = devices.filter(d => d.status === 'available');
                    titleText = '可用设备详情';
                    break;
                case 'borrowed':
                    filteredDevices = devices.filter(d => d.status === 'borrowed');
                    titleText = '已借出设备详情';
                    break;
                case 'error':
                    filteredDevices = devices.filter(d => d.status === 'error');
                    titleText = '异常设备详情';
                    break;
            }
            
            title.textContent = titleText;
            
            // 生成设备列表
            let html = `
                <div class="mb-4">
                    <p class="text-sm text-gray-500">共 ${filteredDevices.length} 个设备</p>
                </div>
            `;
            
            if (filteredDevices.length === 0) {
                html += `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fa fa-info-circle text-4xl mb-2"></i>
                        <p>暂无设备</p>
                    </div>
                `;
            } else {
                html += '<div class="space-y-3">';
                filteredDevices.forEach(device => {
                    const statusText = device.status === 'available' ? '可用' : (device.status === 'borrowed' ? '已借出' : '异常');
                    const statusColor = device.status === 'available' ? 'bg-available/20 text-available' : (device.status === 'borrowed' ? 'bg-borrowed/20 text-borrowed' : 'bg-error/20 text-error');
                    
                    html += `
                        <div class="bg-gray-50 rounded-lg p-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-semibold">设备 #${device.id}</h4>
                                    <div class="flex items-center gap-4 mt-2">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                                            ${statusText}
                                        </span>
                                        <span class="text-sm text-gray-600">位置: ${device.location}</span>
                                    </div>
                                    ${device.status === 'borrowed' ? `
                                        <div class="mt-2 text-sm text-gray-600">
                                            <span>使用人: ${getGuideNameById(device.borrower)}</span><br>
                                            <span>借出时间: ${formatDateTime(device.borrowTime)}</span>
                                        </div>
                                    ` : ''}
                                    ${device.notes ? `
                                        <div class="mt-2 text-sm ${device.status === 'error' ? 'text-error' : 'text-gray-600'}">
                                            <span>备注: ${device.notes}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            content.innerHTML = html;
            modal.classList.remove('hidden');
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        // 页面切换
        function switchPage(pageId) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.add('hidden');
            });
            
            // 显示选中页面
            document.getElementById(`${pageId}-page`).classList.remove('hidden');
            
            // 更新导航栏活动状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.page === pageId) {
                    item.classList.add('active');
                }
            });
            
            // 更新页面标题
            const pageTitles = {
                'dashboard': '仪表盘',
                'devices': '设备管理',
                'borrow': '借用归还',
                'reports': '统计报表',
                'guides': '导游管理'
            };
            
            document.getElementById('page-title').textContent = pageTitles[pageId];
            
            // 如果是报表页面，初始化图表
            if (pageId === 'reports') {
                initializeCharts();
            }
            
            // 关闭移动端菜单
            document.getElementById('mobile-menu').classList.add('translate-x-full');
        }

        // 添加导游
        function handleAddGuide(e) {
            e.preventDefault();
            
            const name = document.getElementById('guide-name').value;
            const phone = document.getElementById('guide-phone').value;
            
            if (!name) {
                showNotification('请填写姓名', 'error');
                return;
            }
            
            // 添加新导游
            const newGuide = {
                id: (guides.length + 1).toString(),
                name,
                phone: phone || '',
                active: true
            };
            guides.push(newGuide);
            saveData();
            
            // 更新界面
            generateGuidesTable();
            updateBorrowForms();
            
            // 重置表单并关闭模态框
            document.getElementById('guide-form').reset();
            document.getElementById('add-guide-modal').classList.add('hidden');
            
            showNotification('导游添加成功', 'success');
        }

        // 添加设备
        function handleAddDevice(e) {
            e.preventDefault();
            
            const id = document.getElementById('device-id').value;
            const status = document.getElementById('device-status').value;
            const location = document.getElementById('device-location').value;
            
            if (!id || !location) {
                showNotification('请填写设备编号和位置', 'error');
                return;
            }
            
            // 检查设备编号是否已存在
            if (devices.find(d => d.id === id)) {
                showNotification('设备编号已存在', 'error');
                return;
            }
            
            // 添加新设备
            const newDevice = {
                id,
                status,
                location,
                borrower: '',
                borrowTime: null,
                notes: ''
            };
            devices.push(newDevice);
            saveData();
            
            // 更新界面
            updateStatsDisplay();
            generateDeviceCards();
            generateDevicesTable();
            updateBorrowForms();
            
            // 重置表单并关闭模态框
            document.getElementById('add-device-form').reset();
            document.getElementById('add-device-modal').classList.add('hidden');
            
            showNotification('设备添加成功', 'success');
        }

        // 删除设备
        function deleteDevice(deviceId) {
            const device = devices.find(d => d.id === deviceId);
            if (device.status === 'borrowed') {
                showNotification('该设备当前已借出，无法删除', 'error');
                return;
            }
            
            devices = devices.filter(d => d.id !== deviceId);
            saveData();
            
            // 更新界面
            updateStatsDisplay();
            generateDeviceCards();
            generateDevicesTable();
            updateBorrowForms();
            
            showNotification('设备删除成功', 'success');
        }

        // 删除导游
        function deleteGuide(guideId) {
            const borrowedDevices = devices.filter(d => d.status === 'borrowed' && d.borrower === guideId);
            if (borrowedDevices.length > 0) {
                showNotification('该导游当前有借用的设备，无法删除', 'error');
                return;
            }
            
            guides = guides.filter(g => g.id !== guideId);
            saveData();
            
            // 更新界面
            generateGuidesTable();
            updateBorrowForms();
            
            showNotification('导游删除成功', 'success');
        }

        // 处理借用表单提交
        function handleBorrowFormSubmit(e) {
            e.preventDefault();
            
            const guideId = document.getElementById('guide-select').value;
            const deviceId = document.getElementById('device-select').value;
            const notes = document.getElementById('borrow-notes').value;
            
            if (!guideId || !deviceId) {
                showNotification('请选择导游和设备', 'error');
                return;
            }
            
            // 更新设备状态
            const device = devices.find(d => d.id === deviceId);
            device.status = 'borrowed';
            device.borrower = guideId;
            device.borrowTime = new Date().toISOString();
            device.location = '使用中';
            if (notes) device.notes = notes;
            
            // 创建借用记录
            const newRecord = {
                id: (records.length + 1).toString(),
                deviceId,
                guideId,
                borrowTime: new Date().toISOString(),
                returnTime: null,
                status: 'active'
            };
            records.push(newRecord);
            
            saveData();
            
            // 更新界面
            updateStatsDisplay();
            generateDeviceCards();
            generateDevicesTable();
            generateRecentActivities();
            updateBorrowForms();
            
            // 重置表单
            document.getElementById('borrow-form').reset();
            
            showNotification('设备借用成功', 'success');
        }

        // 处理归还表单提交
        function handleReturnFormSubmit(e) {
            e.preventDefault();
            
            const deviceId = document.getElementById('return-device-select').value;
            const location = document.getElementById('return-location').value;
            const notes = document.getElementById('return-notes').value;
            
            if (!deviceId || !location) {
                showNotification('请选择设备和归还位置', 'error');
                return;
            }
            
            // 更新设备状态
            const device = devices.find(d => d.id === deviceId);
            const guideId = device.borrower;
            device.status = 'available';
            device.returnTime = new Date().toISOString();
            device.location = location;
            device.borrower = '';
            device.borrowTime = null;
            if (notes) device.notes = notes;
            
            // 更新借用记录
            const record = records.find(r => r.deviceId === deviceId && r.status === 'active');
            if (record) {
                record.returnTime = new Date().toISOString();
                record.status = 'completed';
            }
            
            saveData();
            
            // 更新界面
            updateStatsDisplay();
            generateDeviceCards();
            generateDevicesTable();
            generateRecentActivities();
            updateBorrowForms();
            
            // 重置表单
            document.getElementById('return-form').reset();
            
            showNotification('设备归还成功', 'success');
        }

        // 处理设备搜索
        function handleDeviceSearch() {
            const searchTerm = document.getElementById('device-search').value.toLowerCase();
            const tableBody = document.getElementById('devices-table-body');
            
            const filteredDevices = searchTerm ? devices.filter(device => 
                device.id.toLowerCase().includes(searchTerm) ||
                device.location.toLowerCase().includes(searchTerm) ||
                (device.borrower && getGuideNameById(device.borrower).toLowerCase().includes(searchTerm))
            ) : devices;
            
            // 重新生成表格
            tableBody.innerHTML = '';
            filteredDevices.forEach(device => {
                const statusText = device.status === 'available' ? '可用' : (device.status === 'borrowed' ? '已借出' : '异常');
                const statusColor = device.status === 'available' ? 'bg-available/20 text-available' : (device.status === 'borrowed' ? 'bg-borrowed/20 text-borrowed' : 'bg-error/20 text-error');

                const row = document.createElement('tr');
                row.className = 'bg-white border-b hover:bg-gray-50';
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${device.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.location}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.status === 'borrowed' ? getGuideNameById(device.borrower) : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.borrowTime ? formatDateTime(device.borrowTime) : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex gap-2">
                            <button class="text-primary hover:text-primary/80 edit-device-btn" data-id="${device.id}">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="text-error hover:text-error/80 delete-device-btn" data-id="${device.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });

            // 重新绑定事件
            document.querySelectorAll('.edit-device-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    showEditDeviceModal(btn.dataset.id);
                });
            });

            document.querySelectorAll('.delete-device-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('确定要删除这个设备吗？')) {
                        deleteDevice(btn.dataset.id);
                    }
                });
            });
        }

        // 处理设备筛选
        function handleDeviceFilter() {
            const statusFilter = prompt('请选择状态筛选（available: 可用, borrowed: 已借出, error: 异常）:', 'all');
            
            if (!statusFilter || statusFilter === 'all') {
                generateDevicesTable();
                return;
            }
            
            const filteredDevices = devices.filter(device => device.status === statusFilter);
            const tableBody = document.getElementById('devices-table-body');
            
            tableBody.innerHTML = '';
            filteredDevices.forEach(device => {
                const statusText = device.status === 'available' ? '可用' : (device.status === 'borrowed' ? '已借出' : '异常');
                const statusColor = device.status === 'available' ? 'bg-available/20 text-available' : (device.status === 'borrowed' ? 'bg-borrowed/20 text-borrowed' : 'bg-error/20 text-error');

                const row = document.createElement('tr');
                row.className = 'bg-white border-b hover:bg-gray-50';
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${device.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                            ${statusText}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.location}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.status === 'borrowed' ? getGuideNameById(device.borrower) : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${device.borrowTime ? formatDateTime(device.borrowTime) : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex gap-2">
                            <button class="text-primary hover:text-primary/80 edit-device-btn" data-id="${device.id}">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="text-error hover:text-error/80 delete-device-btn" data-id="${device.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });

            // 重新绑定事件
            document.querySelectorAll('.edit-device-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    showEditDeviceModal(btn.dataset.id);
                });
            });

            document.querySelectorAll('.delete-device-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (confirm('确定要删除这个设备吗？')) {
                        deleteDevice(btn.dataset.id);
                    }
                });
            });
        }

        // 处理仪表盘刷新
        function handleDashboardRefresh() {
            updateStatsDisplay();
            generateDeviceCards();
            generateRecentActivities();
            showNotification('数据已刷新', 'success');
        }

        // 初始化页面
        function initializePage() {
            // 初始化数据
            initializeData();
            
            // 更新当前日期
            const today = new Date();
            document.getElementById('current-date').textContent = today.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });
            
            // 初始化界面
            updateStatsDisplay();
            generateDeviceCards();
            generateDevicesTable();
            generateGuidesTable();
            generateRecentActivities();
            updateBorrowForms();
            
            // 添加事件监听器
            // 导航切换
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchPage(item.dataset.page);
                });
            });
            
            // 移动端菜单
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.remove('translate-x-full');
            });
            
            document.getElementById('close-mobile-menu').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.add('translate-x-full');
            });
            
            // 导游管理
            document.getElementById('add-guide-btn').addEventListener('click', () => {
                document.getElementById('add-guide-modal').classList.remove('hidden');
            });
            
            document.getElementById('close-guide-modal').addEventListener('click', () => {
                document.getElementById('add-guide-modal').classList.add('hidden');
            });
            
            document.getElementById('cancel-guide-btn').addEventListener('click', () => {
                document.getElementById('add-guide-modal').classList.add('hidden');
            });
            
            document.getElementById('guide-form').addEventListener('submit', handleAddGuide);
            
            // 设备管理
            document.getElementById('add-device-btn').addEventListener('click', () => {
                document.getElementById('add-device-modal').classList.remove('hidden');
            });
            
            document.getElementById('close-add-device-modal').addEventListener('click', () => {
                document.getElementById('add-device-modal').classList.add('hidden');
            });
            
            document.getElementById('cancel-add-device-btn').addEventListener('click', () => {
                document.getElementById('add-device-modal').classList.add('hidden');
            });
            
            document.getElementById('add-device-form').addEventListener('submit', handleAddDevice);
            
            // 搜索和筛选
            document.getElementById('device-search').addEventListener('input', handleDeviceSearch);
            document.getElementById('device-filter-btn').addEventListener('click', handleDeviceFilter);
            document.getElementById('dashboard-filter-btn').addEventListener('click', handleDeviceFilter);
            document.getElementById('dashboard-refresh-btn').addEventListener('click', handleDashboardRefresh);
            
            // 借用归还
            document.getElementById('borrow-form').addEventListener('submit', handleBorrowFormSubmit);
            document.getElementById('return-form').addEventListener('submit', handleReturnFormSubmit);
            
            // 弹窗事件
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            
            // 点击弹窗外部关闭
            document.getElementById('details-modal').addEventListener('click', (e) => {
                if (e.target.id === 'details-modal') {
                    closeModal();
                }
            });
            
            // URL hash处理
            window.addEventListener('hashchange', () => {
                const hash = window.location.hash.substring(1);
                if (['dashboard', 'devices', 'borrow', 'reports', 'guides'].includes(hash)) {
                    switchPage(hash);
                }
            });
            
            // 初始页面
            const hash = window.location.hash.substring(1) || 'dashboard';
            switchPage(hash);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
